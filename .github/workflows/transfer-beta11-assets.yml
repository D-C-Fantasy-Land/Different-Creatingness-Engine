name: Transfer Beta1.1 assets

on:
  push:
    branches:
      - codex/transfer-beta11-assets

permissions:
  contents: write

jobs:
  transfer-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download completed platform packages from the personal Beta1.1 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/D-C-LushiFu/Different-Creatingness-Engine/releases/download/VBeta1.1/linux.zip \
            --output artifacts/linux.zip
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/D-C-LushiFu/Different-Creatingness-Engine/releases/download/VBeta1.1/ios.zip \
            --output artifacts/ios.zip
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/D-C-LushiFu/Different-Creatingness-Engine/releases/download/VBeta1.1/android.zip \
            --output artifacts/android.zip
          ls -lh artifacts
      - name: Add packages to the organization Beta1.1 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta1.1
          name: Beta1.1
          files: artifacts/*.zip
          overwrite_files: true
