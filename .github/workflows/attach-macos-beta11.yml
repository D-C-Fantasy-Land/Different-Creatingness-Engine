name: Attach macOS Beta1.1 asset

on:
  push:
    branches:
      - codex/transfer-beta11-assets

permissions:
  actions: read
  contents: write

jobs:
  attach-macos:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful organization macOS build
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-15
          path: artifacts/
          run-id: 42483579130
          github-token: ${{ github.token }}
      - name: Prepare release asset
        run: mv artifacts/macOS-15.zip artifacts/macos.zip
      - name: Add macOS package to the organization Beta1.1 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta1.1
          name: Beta1.1
          files: artifacts/macos.zip
          overwrite_files: true
